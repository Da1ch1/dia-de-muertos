<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Día de Muertos</title>
<meta name="description" content="Video especial de Día de Muertos.">
<meta property="og:title" content="Día de Muertos">
<meta property="og:description" content="Video especial de Día de Muertos.">
<meta property="og:image" content="poster.jpg">
<meta property="og:type" content="video.other">
<meta name="theme-color" content="#1a0f1f">
<link rel="preload" as="image" href="poster.jpg">
<style>
  :root{--bg:#1a0f1f;--marigold:#f5a524;--pink:#e2397f;--text:#fdf3e7}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(120% 80% at 50% 0%,#3a1d3f 0%,var(--bg) 60%);color:var(--text);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;
       align-items:center;justify-content:flex-start;min-height:100svh;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));
       overflow-y:auto}
  .content{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:720px;margin:auto 0;flex-shrink:0}
  h1{font-size:clamp(1.4rem,5.5vw,2.2rem);letter-spacing:.04em;text-align:center;
     background:linear-gradient(90deg,var(--marigold),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .frame{position:relative;z-index:1;width:min(100%,640px);max-height:min(52svh,360px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;
         box-shadow:0 16px 48px rgba(0,0,0,.5),0 0 0 2px rgba(245,165,36,.35);flex-shrink:0}
  video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
        background:rgba(0,0,0,.25);border:0;cursor:pointer;color:var(--text);font:inherit;font-size:1rem;transition:opacity .3s}
  .play.hide{opacity:0;pointer-events:none}
  .play .btn{width:84px;height:84px;border-radius:50%;background:var(--marigold);display:grid;place-items:center;
             box-shadow:0 0 0 10px rgba(245,165,36,.25);animation:pulse 2s infinite}
  .play .btn svg{width:34px;height:34px;margin-left:5px;fill:#1a0f1f}
  @keyframes pulse{50%{box-shadow:0 0 0 18px rgba(245,165,36,.08)}}
  p.hint{font-size:.85rem;opacity:.7;text-align:center;margin-top:2px}
  .petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
  .petals i{position:absolute;top:-20px;width:10px;height:14px;border-radius:60% 0 60% 0;background:var(--marigold);opacity:.6;
            animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
  @media (prefers-reduced-motion:reduce){.petals,.play .btn{animation:none}}

  /* ---- Contador de visitas ---- */
  .counter{position:relative;z-index:2;display:flex;justify-content:center;width:100%;padding:6px 16px 2px;margin:0;flex-shrink:0}
  .count-wrap{position:relative;display:inline-block;padding:4px 8px}
  .visit-count{font-size:clamp(.95rem,2.8vw,1.08rem);font-weight:500;text-align:center;color:var(--marigold);letter-spacing:.04em;line-height:1.35;position:relative;z-index:0}
  .visit-count .num{font-weight:700;font-variant-numeric:tabular-nums;display:inline-block;min-width:1.5ch}
  .visit-count .word{font-weight:500;opacity:.92;text-transform:lowercase}
  .counter.loading .visit-count .num{opacity:.35}
  .counter.err .visit-count{opacity:.65}
  .counter.sweeping .visit-count .num{opacity:0}
  .sweep{position:absolute;inset:-6px -28px;pointer-events:none;overflow:hidden;z-index:1}
  .sweep i{position:absolute;left:0;top:0;width:12px;height:17px;border-radius:60% 0 60% 0;will-change:transform,opacity;
           box-shadow:0 1px 2px rgba(0,0,0,.25)}
</style>
</head>
<body>
  <div class="petals" aria-hidden="true"></div>
  <main class="content">
  <h1>Día de Muertos</h1>
  <div class="frame">
    <video id="v" src="video.mp4" poster="poster.jpg" preload="metadata" playsinline controlslist="nodownload"></video>
    <button class="play" id="p" aria-label="Reproducir video con sonido">
      <span class="btn"><svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg></span>
      <span>Toca para ver con sonido</span>
    </button>
  </div>
  <section class="counter loading" id="counter" aria-live="polite" aria-label="Contador de visitas">
    <div class="count-wrap">
      <p class="visit-count" id="visitLine"><span class="num" id="visitNum">…</span> <span class="word">visitas</span></p>
      <div class="sweep" id="sweep" aria-hidden="true"></div>
    </div>
  </section>
  <p class="hint">Sube el volumen 🔊 · Gira tu teléfono para verlo en grande</p>
  <p class="hint">Creado por Maria Luisa</p>
  </main>
<script>
  const v=document.getElementById('v'), p=document.getElementById('p');
  p.addEventListener('click',()=>{v.muted=false;v.play();p.classList.add('hide');});
  v.addEventListener("play",()=>{v.controls=true;p.classList.add("hide");});
  v.addEventListener('ended',()=>{p.classList.remove('hide');p.querySelector('span:last-child').textContent='Ver de nuevo';});
  const box=document.querySelector('.petals');
  for(let i=0;i<14;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'vw';
    e.style.animationDuration=(8+Math.random()*8)+'s';e.style.animationDelay=(-Math.random()*16)+'s';
    e.style.transform='scale('+(0.6+Math.random()*0.8)+')';box.appendChild(e);}

  /* ===== Contador de visitas ===== */
  const API='/api/visitas', POLL_MS=10000, INTRO_MS=2800;
  const visitNumEl=document.getElementById('visitNum'), counterEl=document.getElementById('counter'), sweepEl=document.getElementById('sweep');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let shown=null, busy=false, pending=null, introDone=false, introTimer=null;

  function render(n){
    visitNumEl.textContent=n.toLocaleString('es-MX');
    counterEl.setAttribute('aria-label',`${n.toLocaleString('es-MX')} visitas`);
  }

  function sweepTo(n){
    if(reduce){
      shown=n; render(n);
      counterEl.classList.remove('loading','err','sweeping');
      return Promise.resolve();
    }
    busy=true;
    counterEl.classList.add('sweeping');
    counterEl.classList.remove('loading','err');
    const W=Math.max(sweepEl.clientWidth,120), H=Math.max(sweepEl.clientHeight,28), N=40, DUR=1400;
    const colors=['#f5a524','#f08a12','#ffb22e','#e8780c','#ffc845'];
    const anims=[];
    for(let i=0;i<N;i++){
      const e=document.createElement('i');
      const y=Math.random()*H, sc=.55+Math.random()*.85, delay=Math.random()*420, dur=DUR*(.72+Math.random()*.45);
      e.style.background=colors[i%colors.length];
      sweepEl.appendChild(e);
      const wob=(Math.random()-.5)*18, r0=Math.random()*360, r1=r0+160+Math.random()*320;
      const a=e.animate([
        {transform:`translate(-48px,${y}px) rotate(${r0}deg) scale(${sc})`,opacity:0},
        {opacity:.95,offset:.1},
        {transform:`translate(${W*.52}px,${y+wob}px) rotate(${(r0+r1)/2}deg) scale(${sc*1.1})`,offset:.5},
        {opacity:.9,offset:.82},
        {transform:`translate(${W+48}px,${y-wob}px) rotate(${r1}deg) scale(${sc})`,opacity:0}
      ],{duration:dur,delay,easing:'cubic-bezier(.42,.06,.58,.94)',fill:'forwards'});
      anims.push(a.finished.then(()=>e.remove()));
    }
    return new Promise(resolve=>{
      setTimeout(()=>{
        shown=n; render(n);
        counterEl.classList.remove('sweeping');
      }, DUR*.52);
      Promise.all(anims).then(()=>{
        busy=false;
        if(pending!==null&&pending!==shown){
          const q=pending; pending=null; sweepTo(q).then(resolve);
        } else resolve();
      });
    });
  }

  function reveal(n){
    if(typeof n!=='number') return;
    if(n===shown&&!counterEl.classList.contains('loading')) return;
    if(busy){ pending=n; return; }
    return sweepTo(n);
  }

  async function call(method){
    const r=await fetch(API+(method==='POST'?'?src='+encodeURIComponent(new URLSearchParams(location.search).get('src')||'directo'):''),
                        {method,cache:'no-store'});
    if(!r.ok) throw new Error(String(r.status));
    return (await r.json()).total;
  }

  async function start(){
    let total;
    let yaContado=false;
    try{ yaContado=sessionStorage.getItem('dm_contado')==='1'; }catch(e){}
    try{
      total=await call(yaContado?'GET':'POST');
      if(!yaContado){ try{ sessionStorage.setItem('dm_contado','1'); }catch(e){} }
    }catch(e){
      try{ total=await call('GET'); }catch(e2){
        counterEl.classList.remove('loading');
        counterEl.classList.add('err');
        visitNumEl.textContent='0';
        counterEl.setAttribute('aria-label','Visitas (contador temporalmente no disponible)');
        introDone=true;
        return;
      }
    }
    introTimer=setTimeout(()=>{
      introDone=true;
      reveal(total);
    }, INTRO_MS);
    setInterval(async()=>{
      if(!introDone||document.hidden) return;
      try{
        const t=await call('GET');
        if(t!==shown) reveal(t);
      }catch(e){}
    }, POLL_MS);
    document.addEventListener('visibilitychange',async()=>{
      if(!document.hidden&&introDone){
        try{ const t=await call('GET'); if(t!==shown) reveal(t); }catch(e){}
      }
    });
  }
  start();
</script>
</body>
</html>
